<!doctype html>
<html lang="zh-CN" data-gary-theme="dark" data-gary-page-mode="data-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gary-UI · 数据页</title>
  <link rel="stylesheet" href="./patterns.css">
</head>
<body class="gary-ui">
  <div class="pattern-scene" data-gary-scene-engine="dot-grid" aria-hidden="true"></div>
  <main class="pattern-page">
    <header class="pattern-bar gary-glass gary-ultrathin">
      <div><strong>数据页</strong><p>判断值优先 · Starting Point 03</p></div>
      <a class="gary-button gary-regular" data-size="small" href="../portal/index.html">返回系统</a>
    </header>
    <section class="pattern-grid" style="margin-top:22px">
      <article class="pattern-card span-4 gary-glass gary-regular"><p class="eyebrow">Option A</p><p class="metric">8.6</p><p class="muted">综合评分 · 推荐</p></article>
      <article class="pattern-card span-4 gary-glass gary-regular"><p class="eyebrow">Option B</p><p class="metric">7.2</p><p class="muted">成本最低</p></article>
      <article class="pattern-card span-4 gary-glass gary-regular"><p class="eyebrow">Option C</p><p class="metric">6.8</p><p class="muted">交付最快</p></article>
      <article class="pattern-card span-12 gary-solid-plate">
        <p class="eyebrow">Comparison table</p>
        <h2>比较项必须可追溯。</h2>
        <table class="table">
          <thead><tr><th>方案</th><th>体验</th><th>风险</th><th>结论</th></tr></thead>
          <tbody>
            <tr><td>A · 单一母本</td><td>8.9</td><td>低</td><td><span class="gary-chip" data-tone="positive">采用</span></td></tr>
            <tr><td>B · 双目录</td><td>7.1</td><td>中</td><td>不推荐</td></tr>
            <tr><td>C · 云端为主</td><td>6.4</td><td>高</td><td>不可持续</td></tr>
          </tbody>
        </table>
      </article>
    </section>
  </main>
  <script src="../patterns/shared/dot-grid.js"></script>
  <script src="../patterns/shared/material.js"></script>
  <script src="../patterns/shared/optical-glass.js"></script>
</body>
</html>
