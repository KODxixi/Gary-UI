<!doctype html><html><head><style>/*
 * Gary UI component runtime.
 * Import only through ../tokens/base.css.
 */

:where(
  .gary-button,
  .gary-segmented,
  .gary-field,
  .gary-tab-bar,
  .gary-web-bar,
  .gary-glass-card,
  .gary-metric-card,
  .gary-comparison-table,
  .gary-decision-grid,
  .gary-media-card,
  .gary-profile-card,
  .gary-scene,
  .gary-chip,
  .gary-evidence-bar
) {
  font-family: var(--gary-font-sans);
  letter-spacing: 0;
}

:where(
  .gary-button,
  .gary-segmented > button,
  .gary-tab-bar [role="tab"],
  .gary-web-bar a,
  .gary-chip
):focus-visible,
.gary-field:focus-within {
  outline: 3px solid var(--gary-focus-ring);
  outline-offset: 3px;
}

/* Button */
.gary-button {
  --gary-glass-fill: var(--gary-glass-regular);
  --gary-glass-blur: var(--gary-blur-regular);
  min-height: var(--gary-control-height);
  padding: 0 var(--gary-space-6);
  border-radius: var(--gary-radius-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--gary-space-2);
  color: var(--gary-text-primary);
  font: inherit;
  font-weight: var(--gary-font-weight-semibold);
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  transition:
    transform var(--gary-duration-base) var(--gary-ease),
    opacity var(--gary-duration-fast) var(--gary-ease),
    box-shadow var(--gary-duration-base) var(--gary-ease),
    background-color var(--gary-duration-fast) var(--gary-ease);
}

.gary-button:hover:not(:disabled, [aria-disabled="true"]) {
  transform: translateY(-1px);
  box-shadow:
    var(--gary-shadow-inset),
    0 3px 7px var(--gary-border-shadow),
    var(--gary-shadow-environment);
}

.gary-button:active:not(:disabled, [aria-disabled="true"]) {
  transform: translateY(1px) scale(0.985);
  box-shadow: var(--gary-shadow-inset), var(--gary-shadow-contact);
}

.gary-button[data-variant="primary"] {
  --gary-glass-fill: var(--gary-glass-thick);
  font-weight: var(--gary-font-weight-bold);
}

.gary-button[data-variant="quiet"] {
  --gary-glass-fill: var(--gary-glass-ultrathin);
  box-shadow: var(--gary-shadow-inset), var(--gary-shadow-contact);
}

.gary-button[data-variant="danger"] {
  color: var(--gary-state-critical);
}

.gary-button[data-size="small"] {
  min-height: 36px;
  padding-inline: var(--gary-space-4);
  font-size: var(--gary-font-size-label);
}

.gary-button[data-size="large"] {
  min-height: 52px;
  padding-inline: var(--gary-space-8);
  font-size: var(--gary-font-size-lead);
}

.gary-button:is(:disabled, [aria-disabled="true"], [aria-busy="true"]) {
  pointer-events: none;
  cursor: not-allowed;
  opacity: 0.44;
  transform: none;
}

/* Segmented control */
.gary-segmented {
  --gary-glass-fill: var(--gary-glass-regular);
  --gary-glass-blur: var(--gary-blur-regular);
  width: fit-content;
  max-width: 100%;
  padding: var(--gary-space-1);
  border-radius: var(--gary-radius-pill);
  display: inline-flex;
  align-items: stretch;
  gap: var(--gary-space-1);
}

.gary-segmented > button {
  min-height: 36px;
  padding: 0 var(--gary-space-4);
  border: 0;
  border-radius: var(--gary-radius-pill);
  color: var(--gary-text-secondary);
  background: transparent;
  font: inherit;
  font-weight: var(--gary-font-weight-medium);
  white-space: nowrap;
  cursor: pointer;
  transition:
    color var(--gary-duration-fast) var(--gary-ease),
    background-color var(--gary-duration-base) var(--gary-ease),
    transform var(--gary-duration-base) var(--gary-ease);
}

.gary-segmented > button:hover:not(:disabled) {
  color: var(--gary-text-primary);
}

.gary-segmented > button:is([aria-pressed="true"], [aria-selected="true"], [data-active="true"]) {
  color: var(--gary-text-primary);
  background: var(--gary-solid-plate);
  box-shadow: var(--gary-shadow-inset), var(--gary-shadow-contact);
}

.gary-segmented > button:active:not(:disabled) {
  transform: scale(0.98);
}

.gary-segmented > button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

/* Field */
.gary-field {
  --gary-glass-fill: var(--gary-glass-regular);
  --gary-glass-blur: var(--gary-blur-regular);
  min-height: var(--gary-control-height);
  padding: 0 var(--gary-space-4);
  border-radius: var(--gary-radius-control);
  display: flex;
  align-items: center;
  gap: var(--gary-space-3);
  color: var(--gary-text-primary);
  transition:
    border-color var(--gary-duration-fast) var(--gary-ease),
    box-shadow var(--gary-duration-base) var(--gary-ease),
    opacity var(--gary-duration-fast) var(--gary-ease);
}

:where(input, textarea, select).gary-field {
  width: 100%;
  appearance: none;
  font: inherit;
}

.gary-field > :where(input, textarea, select) {
  width: 100%;
  min-width: 0;
  padding: var(--gary-space-3) 0;
  border: 0;
  outline: 0;
  color: inherit;
  background: transparent;
  font: inherit;
}

.gary-field > textarea {
  min-height: 112px;
  resize: vertical;
  line-height: var(--gary-line-height-body);
}

:where(input, textarea).gary-field::placeholder,
.gary-field > :where(input, textarea)::placeholder {
  color: var(--gary-text-tertiary);
  opacity: 1;
}

.gary-field:is([aria-invalid="true"], :has(> [aria-invalid="true"])) {
  border-color: var(--gary-state-critical);
}

.gary-field:is([aria-disabled="true"], :has(> :disabled)),
:where(input, textarea, select).gary-field:disabled {
  pointer-events: none;
  opacity: 0.44;
}

.gary-field__label {
  display: block;
  margin-bottom: var(--gary-space-2);
  color: var(--gary-text-secondary);
  font-size: var(--gary-font-size-label);
  font-weight: 620;
}

.gary-field__message {
  margin: var(--gary-space-2) 0 0;
  color: var(--gary-text-tertiary);
  font-size: var(--gary-font-size-caption);
}

[aria-invalid="true"] + .gary-field__message,
.gary-field__message[data-state="error"] {
  color: var(--gary-state-critical);
}

/* Tab bar */
.gary-tab-bar {
  --gary-glass-fill: var(--gary-glass-ultrathin);
  --gary-glass-blur: var(--gary-blur-ultrathin);
  width: fit-content;
  max-width: 100%;
  min-height: 52px;
  padding: var(--gary-space-1);
  border-radius: var(--gary-radius-pill);
  display: flex;
  align-items: center;
  gap: var(--gary-space-1);
}

.gary-tab-bar [role="tab"] {
  min-height: 42px;
  padding: 0 var(--gary-space-4);
  border: 0;
  border-radius: var(--gary-radius-pill);
  color: var(--gary-text-secondary);
  background: transparent;
  font: inherit;
  font-weight: 620;
  white-space: nowrap;
  cursor: pointer;
  transition:
    color var(--gary-duration-fast) var(--gary-ease),
    background-color var(--gary-duration-base) var(--gary-ease);
}

.gary-tab-bar [role="tab"]:hover {
  color: var(--gary-text-primary);
}

.gary-tab-bar [role="tab"][aria-selected="true"] {
  color: var(--gary-text-primary);
  background: var(--gary-solid-plate);
  box-shadow: var(--gary-shadow-inset), var(--gary-shadow-contact);
}

.gary-tab-bar [role="tab"]:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

/* Web bar */
.gary-web-bar {
  --gary-glass-fill: var(--gary-glass-ultrathin);
  --gary-glass-blur: var(--gary-blur-ultrathin);
  width: min(1180px, calc(100% - 32px));
  min-height: 56px;
  margin-inline: auto;
  padding: var(--gary-space-2) var(--gary-space-3) var(--gary-space-2) var(--gary-space-6);
  border-radius: var(--gary-radius-pill);
  display: flex;
  align-items: center;
  gap: var(--gary-density-control-gap);
}

.gary-web-bar__brand {
  color: var(--gary-text-primary);
  font-weight: 740;
  white-space: nowrap;
}

.gary-web-bar__nav {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--gary-space-1);
  scrollbar-width: none;
}

.gary-web-bar__nav::-webkit-scrollbar {
  display: none;
}

.gary-web-bar a {
  min-height: 38px;
  padding: 0 var(--gary-space-3);
  border-radius: var(--gary-radius-pill);
  display: inline-flex;
  align-items: center;
  color: var(--gary-text-secondary);
  text-decoration: none;
  white-space: nowrap;
  transition:
    color var(--gary-duration-fast) var(--gary-ease),
    background-color var(--gary-duration-base) var(--gary-ease);
}

.gary-web-bar a:hover,
.gary-web-bar a[aria-current="page"] {
  color: var(--gary-text-primary);
  background: var(--gary-solid-plate);
}

.gary-web-bar__actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--gary-space-2);
}

/* Glass and metric cards */
.gary-glass-card,
.gary-metric-card {
  --gary-glass-fill: var(--gary-glass-thick);
  --gary-glass-blur: var(--gary-blur-thick);
  border-radius: var(--gary-radius-card);
  padding: var(--gary-density-surface-padding);
}

.gary-glass-card[data-interactive="true"],
.gary-metric-card[data-interactive="true"] {
  transition:
    transform var(--gary-duration-slow) var(--gary-ease),
    box-shadow var(--gary-duration-slow) var(--gary-ease);
}

.gary-glass-card[data-interactive="true"]:hover,
.gary-metric-card[data-interactive="true"]:hover {
  transform: translateY(-2px);
}

.gary-glass-card[aria-disabled="true"] {
  pointer-events: none;
  cursor: not-allowed;
  border-style: dashed;
  opacity: 0.62;
  filter: grayscale(0.7);
}

.gary-glass-card__eyebrow,
.gary-metric-card__label {
  margin: 0 0 var(--gary-space-2);
  color: var(--gary-text-secondary);
  font-size: 0.8125rem;
  font-weight: 650;
}

.gary-glass-card__title {
  margin: 0;
  font-size: var(--gary-font-size-title);
  line-height: 1.28;
}

.gary-glass-card__body {
  margin: var(--gary-space-3) 0 0;
  color: var(--gary-text-secondary);
}

.gary-metric-card {
  display: grid;
  align-content: space-between;
  gap: var(--gary-density-layout-gap);
  min-height: 180px;
}

.gary-metric-card[aria-busy="true"] {
  cursor: progress;
}

.gary-metric-card[aria-busy="true"] > * {
  opacity: 0.42;
}

.gary-metric-card[aria-busy="true"] .gary-metric-card__value {
  color: transparent;
  border-radius: var(--gary-radius-control);
  background:
    linear-gradient(
      100deg,
      var(--gary-surface-sunken) 20%,
      color-mix(in srgb, var(--gary-text-primary) 12%, transparent) 45%,
      var(--gary-surface-sunken) 70%
    );
  background-size: 240% 100%;
  animation: gary-loading-sweep var(--gary-duration-slow) var(--gary-ease) infinite alternate;
}

.gary-metric-card__value {
  margin: 0;
  font-family: var(--gary-font-mono);
  font-size: var(--gary-font-size-display);
  font-weight: 760;
  line-height: 0.98;
  letter-spacing: -0.045em;
}

.gary-metric-card__meta {
  padding-top: var(--gary-space-4);
  border-top: 1px solid var(--gary-border-shadow);
  color: var(--gary-text-secondary);
  display: flex;
  justify-content: space-between;
  gap: var(--gary-space-3);
}

/* Comparison table */
.gary-comparison-table {
  --gary-glass-fill: var(--gary-glass-thick);
  --gary-glass-blur: var(--gary-blur-thick);
  border-radius: var(--gary-radius-card);
  padding: var(--gary-density-control-gap);
}

.gary-comparison-table > table {
  width: 100%;
  border-collapse: separate;
  border-spacing: var(--gary-space-1);
  table-layout: fixed;
}

.gary-comparison-table :where(th, td) {
  min-width: 0;
  padding: var(--gary-space-3) var(--gary-space-4);
  color: var(--gary-text-secondary);
  background: var(--gary-solid-plate);
  overflow-wrap: anywhere;
  text-align: left;
  vertical-align: top;
}

.gary-comparison-table th {
  color: var(--gary-text-primary);
  font-weight: 700;
}

.gary-comparison-table :where(th, td):first-child {
  border-radius: var(--gary-radius-control) 0 0 var(--gary-radius-control);
}

.gary-comparison-table :where(th, td):last-child {
  border-radius: 0 var(--gary-radius-control) var(--gary-radius-control) 0;
}

.gary-comparison-table [data-numeric="true"] {
  font-family: var(--gary-font-mono);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.gary-comparison-table [data-recommended="true"] {
  color: var(--gary-text-primary);
  box-shadow: inset 0 0 0 2px var(--gary-focus-ring);
}

.gary-comparison-table__empty {
  display: none;
  min-height: 160px;
  padding: var(--gary-density-surface-padding);
  place-items: center;
  color: var(--gary-text-secondary);
  text-align: center;
}

.gary-comparison-table[data-state="empty"] > table {
  display: none;
}

.gary-comparison-table[data-state="empty"] > .gary-comparison-table__empty {
  display: grid;
}

/* Decision grid */
.gary-decision-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gary-density-layout-gap);
}

.gary-decision-grid > [data-gary-decision] {
  min-width: 0;
  padding: var(--gary-density-surface-padding);
  border: 1px solid;
  border-color:
    var(--gary-border-highlight)
    var(--gary-border-shadow)
    var(--gary-border-shadow)
    var(--gary-border-highlight);
  border-radius: var(--gary-radius-card);
  color: var(--gary-text-primary);
  background: var(--gary-glass-thick);
  box-shadow:
    var(--gary-shadow-inset),
    var(--gary-shadow-contact),
    var(--gary-shadow-environment);
  -webkit-backdrop-filter:
    blur(var(--gary-blur-thick)) saturate(var(--gary-glass-saturate))
    brightness(var(--gary-glass-brightness)) contrast(var(--gary-glass-contrast));
  backdrop-filter:
    blur(var(--gary-blur-thick)) saturate(var(--gary-glass-saturate))
    brightness(var(--gary-glass-brightness)) contrast(var(--gary-glass-contrast));
}

.gary-decision-grid > [data-gary-decision="recommended"] {
  box-shadow:
    inset 0 0 0 2px var(--gary-focus-ring),
    var(--gary-shadow-inset),
    var(--gary-shadow-contact),
    var(--gary-shadow-environment);
}

.gary-decision-grid > [aria-selected="true"] {
  border-color: var(--gary-focus-ring);
  box-shadow:
    inset 0 0 0 2px var(--gary-focus-ring),
    var(--gary-shadow-inset),
    var(--gary-shadow-contact),
    var(--gary-shadow-environment);
}

.gary-decision-grid > [aria-disabled="true"] {
  pointer-events: none;
  cursor: not-allowed;
  border-color: color-mix(in srgb, var(--gary-state-critical) 64%, var(--gary-border-shadow));
  color: var(--gary-text-secondary);
  background:
    repeating-linear-gradient(
      135deg,
      transparent 0 10px,
      color-mix(in srgb, var(--gary-state-critical) 8%, transparent) 10px 20px
    ),
    var(--gary-solid-plate);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gary-state-critical) 32%, transparent);
}

/* Media card */
.gary-media-card {
  --gary-glass-fill: var(--gary-glass-thick);
  --gary-glass-blur: var(--gary-blur-thick);
  margin: 0;
  padding: var(--gary-space-2);
  border-radius: var(--gary-radius-card);
  display: grid;
  gap: var(--gary-space-2);
}

.gary-media-card__media {
  width: 100%;
  aspect-ratio: 16 / 10;
  border-radius: calc(var(--gary-radius-card) - var(--gary-space-1));
  display: block;
  object-fit: cover;
  background: var(--gary-surface-sunken);
}

.gary-media-card__caption {
  padding: var(--gary-space-4);
  border-radius: var(--gary-radius-control);
  color: var(--gary-text-secondary);
  background: var(--gary-solid-plate);
}

.gary-media-card__caption strong {
  display: block;
  margin-bottom: var(--gary-space-1);
  color: var(--gary-text-primary);
}

.gary-media-card[aria-busy="true"] {
  cursor: progress;
}

.gary-media-card[aria-busy="true"] .gary-media-card__media {
  filter: grayscale(1);
  opacity: 0.46;
}

.gary-media-card[data-state="error"] {
  border-color: var(--gary-state-critical);
}

.gary-media-card[data-state="error"] .gary-media-card__media {
  background:
    repeating-linear-gradient(
      135deg,
      var(--gary-surface-sunken) 0 12px,
      color-mix(in srgb, var(--gary-state-critical) 10%, var(--gary-surface-sunken)) 12px 24px
    );
}

/* Profile card */
.gary-profile-card {
  --gary-glass-fill: var(--gary-glass-thick);
  --gary-glass-blur: var(--gary-blur-thick);
  padding: var(--gary-density-surface-padding);
  border-radius: var(--gary-radius-card);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--gary-density-control-gap);
}

.gary-profile-card__avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: block;
  object-fit: cover;
  background: var(--gary-solid-plate);
  box-shadow: var(--gary-shadow-inset), var(--gary-shadow-contact);
}

.gary-profile-card__name {
  margin: 0;
  color: var(--gary-text-primary);
  font-size: 1rem;
  font-weight: 700;
}

.gary-profile-card__meta {
  margin: var(--gary-space-1) 0 0;
  color: var(--gary-text-secondary);
  font-size: 0.875rem;
}

.gary-profile-card__actions {
  display: flex;
  align-items: center;
  gap: var(--gary-space-2);
}

.gary-profile-card[data-status="available"] .gary-profile-card__avatar {
  outline: 2px solid var(--gary-state-positive);
  outline-offset: 3px;
}

.gary-profile-card[aria-disabled="true"] {
  pointer-events: none;
  cursor: not-allowed;
  border-style: dashed;
  opacity: 0.62;
  filter: grayscale(0.72);
}

/* One scene plus one global mask */
.gary-scene {
  position: relative;
  isolation: isolate;
  min-height: 100%;
  color: var(--gary-text-primary);
  background:
    var(
      --gary-scene-image,
      radial-gradient(circle at 18% 18%, var(--gary-text-tertiary), transparent 34%),
      linear-gradient(145deg, var(--gary-surface-page), var(--gary-surface-sunken))
    );
  background-position: var(--gary-scene-position, center);
  background-repeat: no-repeat;
  background-size: var(--gary-scene-size, cover);
}

.gary-scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: var(--gary-scene-mask);
}

.gary-scene > * {
  position: relative;
}

/* Chip */
.gary-chip {
  min-height: 28px;
  padding: 0 var(--gary-space-3);
  border: 1px solid var(--gary-border-shadow);
  border-radius: var(--gary-radius-pill);
  display: inline-flex;
  align-items: center;
  gap: var(--gary-space-2);
  color: var(--gary-text-secondary);
  background: var(--gary-solid-plate);
  box-shadow: var(--gary-shadow-inset);
  font-size: 0.8125rem;
  font-weight: 650;
  line-height: 1;
}

button.gary-chip {
  cursor: pointer;
}

.gary-chip:is([aria-pressed="true"], [aria-selected="true"]) {
  color: var(--gary-text-primary);
  box-shadow: inset 0 0 0 2px var(--gary-focus-ring), var(--gary-shadow-inset);
}

.gary-chip[data-tone="positive"] {
  color: var(--gary-state-positive);
}

.gary-chip[data-tone="caution"] {
  color: var(--gary-state-caution);
}

.gary-chip[data-tone="critical"] {
  color: var(--gary-state-critical);
}

.gary-chip:is(:disabled, [aria-disabled="true"]) {
  pointer-events: none;
  opacity: 0.44;
}

.gary-solid-plate[aria-disabled="true"] {
  pointer-events: none;
  cursor: not-allowed;
  border-style: dashed;
  opacity: 0.62;
}

/* Evidence bar */
.gary-evidence-bar {
  min-width: 0;
  padding: var(--gary-space-3) var(--gary-space-4);
  border: 1px solid var(--gary-border-shadow);
  border-radius: var(--gary-radius-control);
  display: flex;
  align-items: center;
  gap: var(--gary-space-3);
  color: var(--gary-text-secondary);
  background: var(--gary-solid-plate);
  box-shadow: var(--gary-shadow-inset), var(--gary-shadow-contact);
  font-size: 0.8125rem;
}

.gary-evidence-bar__label {
  color: var(--gary-text-primary);
  font-weight: 700;
}

.gary-evidence-bar__source {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.gary-evidence-bar__meta {
  margin-left: auto;
  color: var(--gary-text-tertiary);
  font-family: var(--gary-font-mono);
  white-space: nowrap;
}

.gary-evidence-bar[data-state="verified"] {
  border-color: color-mix(in srgb, var(--gary-state-positive) 52%, var(--gary-border-shadow));
}

.gary-evidence-bar[data-state="verified"] .gary-evidence-bar__label {
  color: var(--gary-state-positive);
}

.gary-evidence-bar[data-state="stale"] {
  border-color: color-mix(in srgb, var(--gary-state-caution) 56%, var(--gary-border-shadow));
}

.gary-evidence-bar[data-state="stale"] .gary-evidence-bar__label {
  color: var(--gary-state-caution);
}

.gary-evidence-bar[data-state="missing"] {
  border-color: color-mix(in srgb, var(--gary-state-critical) 56%, var(--gary-border-shadow));
  border-style: dashed;
}

.gary-evidence-bar[data-state="missing"] .gary-evidence-bar__label {
  color: var(--gary-state-critical);
}

@keyframes gary-loading-sweep {
  from { background-position: 100% 0; }
  to { background-position: 0 0; }
}

@media (max-width: 900px) {
  .gary-decision-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .gary-web-bar__nav {
    flex: 1 1 auto;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scroll-snap-type: inline proximity;
  }

  .gary-web-bar__nav > * {
    flex: 0 0 auto;
    scroll-snap-align: start;
  }
}

@media (max-width: 640px) {
  .gary-web-bar {
    width: calc(100% - 24px);
    padding-left: var(--gary-space-4);
  }

  .gary-tab-bar,
  .gary-segmented {
    width: 100%;
  }

  .gary-tab-bar [role="tab"],
  .gary-segmented > button {
    flex: 1 1 0;
    min-width: 0;
    padding-inline: var(--gary-space-2);
  }

  .gary-decision-grid {
    grid-template-columns: 1fr;
  }

  .gary-profile-card {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .gary-profile-card__actions {
    grid-column: 1 / -1;
  }

  .gary-comparison-table > table,
  .gary-comparison-table :where(thead, tbody, tr, th, td) {
    display: block;
    width: 100%;
  }

  .gary-comparison-table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .gary-comparison-table tbody {
    display: grid;
    gap: var(--gary-space-2);
  }

  .gary-comparison-table tr {
    padding: var(--gary-space-2);
    border-radius: var(--gary-radius-control);
    background: var(--gary-solid-plate);
  }

  .gary-comparison-table td {
    padding: var(--gary-space-2);
    border-radius: 0;
    display: grid;
    grid-template-columns: minmax(7rem, 0.45fr) minmax(0, 1fr);
    gap: var(--gary-space-3);
    background: transparent;
    text-align: left;
  }

  .gary-comparison-table td::before {
    content: attr(data-label);
    color: var(--gary-text-tertiary);
    font-weight: 620;
  }

  .gary-evidence-bar {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .gary-evidence-bar__meta {
    width: 100%;
    margin-left: 0;
  }
}

[data-gary-theme="light"] {
  color-scheme: light;
  --gary-text-primary: rgba(34, 30, 27, 0.94);
  --gary-text-secondary: rgba(34, 30, 27, 0.64);
  --gary-text-tertiary: rgba(34, 30, 27, 0.46);
  --gary-surface-page: #dedbd6;
  --gary-surface-sunken: rgba(74, 64, 54, 0.08);
  --gary-glass-ultrathin: rgba(255, 252, 246, 0.22);
  --gary-glass-regular: rgba(255, 252, 246, 0.34);
  --gary-glass-thick: rgba(255, 252, 246, 0.48);
  --gary-solid-plate: rgba(246, 242, 235, 0.88);
  --gary-border-highlight: rgba(255, 255, 255, 0.74);
  --gary-border-shadow: rgba(77, 67, 58, 0.16);
  --gary-focus-ring: #007aff;
  --gary-state-positive: #248a3d;
  --gary-state-caution: #9a6700;
  --gary-state-critical: #d70015;
  --gary-shadow-contact: 0 2px 5px rgba(0, 0, 0, 0.14);
  --gary-shadow-environment: 0 28px 72px rgba(0, 0, 0, 0.14);
  --gary-shadow-inset: inset 0 1px 1px rgba(255, 255, 255, 0.44), inset 0 -1px 1px rgba(77, 67, 58, 0.10), inset 0 0 28px rgba(255, 255, 255, 0.08);
  --gary-glass-specular-opacity: 0.22;
  --gary-glass-sheen-opacity: 0.18;
  --gary-glass-brightness: 1.03;
  --gary-glass-contrast: 1.03;
  --gary-glass-saturate: 106%;
  --gary-scene-mask: rgba(238, 234, 226, 0.36);
}

[data-gary-density="spacious"] {
  --gary-density-surface-padding: 32px;
  --gary-density-layout-gap: 28px;
  --gary-density-section-gap: 48px;
  --gary-density-control-gap: 12px;
}

[data-gary-density="compact"] {
  --gary-density-surface-padding: 18px;
  --gary-density-layout-gap: 12px;
  --gary-density-section-gap: 24px;
  --gary-density-control-gap: 6px;
}

:where(.gary-ui, .gary-ui *),
:where([data-gary-ui], [data-gary-ui] *) {
  box-sizing: border-box;
}

:where(.gary-ui, [data-gary-ui]) {
  min-width: 0;
  color: var(--gary-text-primary);
  font-family: var(--gary-font-sans);
  font-feature-settings: "tnum" 1, "ss01" 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  line-height: var(--gary-line-height-body);
}

:where(
  .gary-glass,
  .gary-button,
  .gary-segmented,
  .gary-field,
  .gary-tab-bar,
  .gary-web-bar,
  .gary-glass-card,
  .gary-metric-card,
  .gary-comparison-table,
  .gary-media-card,
  .gary-profile-card
) {
  --gary-glass-fill: var(--gary-glass-regular);
  --gary-glass-blur: var(--gary-blur-regular);
  position: relative;
  isolation: isolate;
  min-width: 0;
  overflow: hidden;
  color: var(--gary-text-primary);
  background:
    var(--gary-glass-frost),
    linear-gradient(var(--gary-glass-highlight-angle), rgba(255, 255, 255, 0.10), transparent 44%, rgba(0, 0, 0, 0.035) 74%, rgba(255, 255, 255, 0.04)),
    var(--gary-glass-fill);
  background-blend-mode: overlay, normal, normal;
  border: 1px solid;
  border-color:
    var(--gary-border-highlight)
    var(--gary-border-shadow)
    var(--gary-border-shadow)
    var(--gary-border-highlight);
  box-shadow:
    var(--gary-shadow-inset),
    var(--gary-shadow-contact),
    var(--gary-shadow-environment);
  -webkit-backdrop-filter:
    blur(var(--gary-glass-blur)) saturate(var(--gary-glass-saturate))
    brightness(var(--gary-glass-brightness)) contrast(var(--gary-glass-contrast));
  backdrop-filter:
    blur(var(--gary-glass-blur)) saturate(var(--gary-glass-saturate))
    brightness(var(--gary-glass-brightness)) contrast(var(--gary-glass-contrast));
}

:where(
  .gary-glass,
  .gary-button,
  .gary-segmented,
  .gary-field,
  .gary-tab-bar,
  .gary-web-bar,
  .gary-glass-card,
  .gary-metric-card,
  .gary-comparison-table,
  .gary-media-card,
  .gary-profile-card
)::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  padding: var(--gary-glass-edge-width);
  border-radius: inherit;
  pointer-events: none;
  background:
    linear-gradient(
      var(--gary-glass-highlight-angle),
      rgba(255, 255, 255, 0.18) 0%,
      rgba(255, 255, 255, 0.04) 24%,
      rgba(0, 0, 0, 0.04) 54%,
      rgba(0, 0, 0, 0.08) 100%
    );
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask-composite: exclude;
  mix-blend-mode: screen;
  opacity: var(--gary-glass-specular-opacity);
}

:where(
