name: Check and publish Gary-UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gary-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adapters/visual/package-lock.json
      - name: Build and check public source snapshot
        run: |
          npm --prefix adapters/visual ci
          node scripts/build_demo_assets.mjs
          node adapters/visual/runner.mjs export --manifest examples/visuals/visuals.json
          node adapters/visual/runner.mjs export --manifest examples/demos/visuals/visuals.json
          node scripts/demo_edition_qa.mjs --quick
          python scripts/build_public.py --output /tmp/gary-ui-public
          python scripts/check_public.py --root /tmp/gary-ui-public
      - name: Install browser test dependencies
        run: |
          npm --prefix adapters/visual run build
          node adapters/visual/node_modules/playwright-core/cli.js install --with-deps chromium
          npm --prefix adapters/visual run doctor
      - name: Check runtime projection and source contracts
        run: |
          python -B scripts/runtime_projection.py build --staging /tmp/gary-ui-runtime
          python -B scripts/runtime_projection.py --runtime /tmp/gary-ui-runtime check
          python -B -m pytest -q
          python -B scripts/validate.py
          python -B scripts/validate_v2.py
      - name: Check React adapter
        run: |
          npm --prefix adapters/react-shadcn ci
          npm --prefix adapters/react-shadcn run typecheck
          npm --prefix adapters/react-shadcn run build
      - name: Build static site
        run: python /tmp/gary-ui-public/scripts/build_site.py --output /tmp/gary-ui-site
      - name: Check actual Pages subpath and complete demos
        run: |
          mkdir -p /tmp/gary-ui-pages/Gary-UI
          cp -a /tmp/gary-ui-site/. /tmp/gary-ui-pages/Gary-UI/
          python -m http.server 4173 --bind 127.0.0.1 --directory /tmp/gary-ui-pages > /tmp/gary-ui-preview.log 2>&1 &
          GARY_UI_BASE_URL=http://127.0.0.1:4173/Gary-UI/ node scripts/public_smoke.mjs
          GARY_UI_BASE_URL=http://127.0.0.1:4173/Gary-UI/ node scripts/demo0909_qa.mjs
          node scripts/demo_browser_qa.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
