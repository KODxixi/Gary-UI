<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="青浦云谷总平关系示意图">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0h40v40H0z" fill="#f2f2f2"/>
      <path d="M0 0h40M0 0v40" stroke="#dadada" stroke-width="1"/>
    </pattern>
    <linearGradient id="bldgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5f56"/>
      <stop offset="1" stop-color="#1f423c"/>
    </linearGradient>
    <linearGradient id="bldgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d9c8f"/>
      <stop offset="1" stop-color="#3f7367"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- site boundary (red line) -->
  <path d="M210 150 L980 150 L980 250 L1370 250 L1370 700 L1180 700 L1180 780 L210 780 Z"
        fill="#ffffff" fill-opacity="0.72" stroke="#c9303a" stroke-width="3" stroke-dasharray="14 8"/>

  <!-- roads -->
  <rect x="0" y="800" width="1600" height="70" fill="#e6e6e6"/>
  <path d="M0 835h1600" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="24 14"/>
  <text x="26" y="872" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b6b6b">北侧城市道路 · 双向四车道</text>
  <rect x="1420" y="150" width="70" height="650" fill="#e6e6e6"/>
  <text x="1296" y="140" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b6b6b" text-anchor="end">东侧规划路</text>

  <!-- green belt -->
  <path d="M230 690 L1180 690 L1180 730 L230 730 Z" fill="#dde8e4"/>
  <text x="250" y="716" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#24514a">南侧景观绿带 · 宽 12 m</text>

  <!-- block A: office tower cluster -->
  <rect x="262" y="200" width="270" height="180" rx="8" fill="url(#bldgA)"/>
  <text x="397" y="300" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
  <text x="397" y="332" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#dde8e4" text-anchor="middle">研发塔楼 3 栋</text>

  <rect x="562" y="200" width="180" height="180" rx="8" fill="url(#bldgB)"/>
  <text x="652" y="292" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">A-2</text>
  <text x="652" y="318" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#eef5f2" text-anchor="middle">配套服务</text>

  <rect x="772" y="200" width="170" height="180" rx="8" fill="#8ab3a8" fill-opacity="0.65"/>
  <text x="857" y="300" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#173b34" text-anchor="middle" font-weight="bold">A-3</text>
  <text x="857" y="326" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#24514a" text-anchor="middle">人才公寓</text>

  <!-- block B -->
  <rect x="1010" y="300" width="320" height="330" rx="8" fill="url(#bldgB)"/>
  <text x="1170" y="470" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
  <text x="1170" y="502" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#eef5f2" text-anchor="middle">研发总部 · 双塔</text>

  <!-- central plaza -->
  <ellipse cx="640" cy="540" rx="230" ry="96" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="2"/>
  <text x="640" y="532" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#474747" text-anchor="middle">中央景观广场</text>
  <text x="640" y="562" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle">地下车库出入口位于广场西侧</text>

  <!-- main entrance -->
  <path d="M600 690 L600 780" stroke="#24514a" stroke-width="10" stroke-dasharray="10 10"/>
  <text x="616" y="742" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#24514a">人行主入口</text>

  <!-- north arrow -->
  <g transform="translate(1470,80)">
    <path d="M0 46 L14 0 L28 46 L14 34 Z" fill="#24514a"/>
    <text x="14" y="72" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#24514a" text-anchor="middle">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(240,86)">
    <rect x="0" y="0" width="120" height="10" fill="#474747"/>
    <rect x="120" y="0" width="120" height="10" fill="#ffffff" stroke="#474747" stroke-width="1"/>
    <text x="0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#474747">0</text>
    <text x="120" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#474747" text-anchor="middle">50 m</text>
    <text x="240" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#474747" text-anchor="middle">100 m</text>
  </g>

  <text x="240" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#474747">总平关系示意 · 用地 4.28 万 ㎡ · 计容 9.42 万 ㎡</text>
</svg>
